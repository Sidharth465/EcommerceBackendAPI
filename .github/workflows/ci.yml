name: CI/CD Pipeline

on:
  pull_request:
    branches: [trunk, develop]
  # Removed push triggers - only PRs allowed to trunk/develop

# Add permissions for GITHUB_TOKEN
permissions:
  contents: read # Read repository contents
  pull-requests: write # Write comments on PRs
  issues: write # Write comments on issues
  checks: write # Write check results
  statuses: write # Write status checks

jobs:
  # Job 1: Basic Checks (No Dependencies)
  basic-checks:
    name: Basic Code Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file line count
        run: |
          echo "🔍 Checking file line counts (max 500 lines)..."
          
          # Check all TypeScript and JavaScript files
          find src -name "*.ts" -o -name "*.js" | while read file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 500 ]; then
              echo "❌ $file has $lines lines (exceeds 500 line limit)"
            else
              echo "✅ $file: $lines lines (OK)"
            fi
          done

          # Check if any file failed
          if find src -name "*.ts" -o -name "*.js" | xargs wc -l | awk '$1 > 500 {print $2 " has " $1 " lines (exceeds 500)"; exit 1}'; then
            echo "❌ Some files exceed the 500 line limit"
            exit 1
          else
            echo "✅ All files are within the 500 line limit"
          fi

  # Job 2: Code Quality (Requires Dependencies)
  code-quality:
    name: Code Quality & Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Run Prettier check
        run: |
          echo "🎨 Checking code formatting with Prettier..."
          yarn prettier:check
        continue-on-error: false

      - name: Run ESLint
        run: |
          echo "🔍 Running ESLint checks..."
          yarn lint
        continue-on-error: false

      - name: Run TypeScript compilation check
        run: |
          echo "🔧 Checking TypeScript compilation..."
          npx tsc --noEmit

  # Job 3: PR Title Validation (No Dependencies)
  pr-title-check:
    name: PR Title Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types based on conventional commits
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
          # Allowed scopes (optional)
          scopes: |
            auth
            user
            product
            order
            payment
            api
            db
            config
            deps
          # Require scope
          requireScope: false
          # No subject pattern - allow any subject as long as type is correct

  # Job 4: Security & Dependencies (Requires Dependencies)
  security-check:
    name: Security & Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run yarn audit
        run: |
          echo "🔒 Running security audit..."
          yarn audit --level moderate

      - name: Check for outdated dependencies
        run: |
          echo "📦 Checking for outdated dependencies..."
          yarn outdated || true

  # Job 5: Build Test (Requires Dependencies)
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [basic-checks, code-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: |
          echo "🏗️ Building TypeScript project..."
          npx tsc

      - name: Run tests (when available)
        run: |
          echo "🧪 Running tests..."
          # npm test
          echo "Tests will be added in future iterations"

  # PR Comment job removed to avoid permission issues
  # You can see job results in the GitHub Actions tab instead
